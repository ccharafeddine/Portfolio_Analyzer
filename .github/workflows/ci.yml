name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Keep any Qt import headless on the CI runners.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          # requirements.txt was removed with the Streamlit app; key the pip
          # cache on the files CI actually installs from.
          cache-dependency-path: |
            requirements-dev.txt
            requirements-desktop.txt

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (critical errors only)
        run: python -m ruff check --select=E9,F63,F7,F82 src main_desktop.py

      - name: Compile check
        run: python -m compileall -q src main_desktop.py

      - name: Run tests
        run: python -m pytest -q

  web:
    name: Web demo (Worker tests, static build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Price proxy Worker unit tests
        run: node --test web/worker/test/worker.test.mjs

      - name: Build the static site
        run: python3 web/build.py
